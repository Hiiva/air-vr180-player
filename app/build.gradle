plugins {
    id 'com.android.application'
}

def localConfig = new Properties()
def localConfigFile = rootProject.file("local.properties")
if (localConfigFile.exists()) {
    localConfigFile.withInputStream { localConfig.load(it) }
}

android {
    namespace = 'com.enricoros.nreal'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.enricoros.nreal"
        minSdk = 30
        targetSdk = 33
        versionCode = 1
        versionName = "1.0"
        buildConfigField "boolean", "TRUST_ALL_SERVER_CERTS", localConfig.getProperty("airVr180.trustAllServerCerts", "false")
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.media3:media3-exoplayer:1.10.0'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.8.0'
}
